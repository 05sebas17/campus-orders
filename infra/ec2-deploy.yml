AWSTemplateFormatVersion: '2010-09-09'
Description: Native CodePipeline EC2 deployment with SSM for the existing campus-orders instance.
Parameters:
  ArtifactBucket:
    Type: String
  PipelineName:
    Type: String
    Default: campus-orders-ci
  PipelineRoleName:
    Type: String
  InstanceId:
    Type: AWS::EC2::Instance::Id
Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadPipelineRevision
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/${PipelineName}/*
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  PipelineDeploymentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-deploy
      Roles: [!Ref PipelineRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ssm:CancelCommand
              - ssm:DescribeInstanceInformation
              - ssm:ListCommandInvocations
              - ssm:GetCommandInvocation
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
            Resource: '*'
          - Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
            Condition:
              StringEquals:
                aws:ResourceTag/CampusOrdersDeploy: !Ref AWS::StackName
          - Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codepipeline/${PipelineName}:*
Outputs:
  InstanceProfileName:
    Value: !Ref InstanceProfile
