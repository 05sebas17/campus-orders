spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${SERVER_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:18081}
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
